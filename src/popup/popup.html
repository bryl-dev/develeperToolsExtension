<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Dev Toolbox</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 340px;
        min-height: 320px;
        max-height: 500px;
        overflow-y: auto;
        background: #f5f5f5;
        font-family: system-ui, sans-serif;
      }

      h3 {
        margin: 12px;
        font-size: 1.1rem;
        text-align: center;
        color: #222;
      }

      select {
        display: block;
        margin: 0 auto 12px auto;
        padding: 6px 8px;
        width: 90%;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 0.95rem;
        background: white;
      }

      #toolContainer {
        display: flex;
        justify-content: center;
        padding: 0 10px 12px 10px;
      }
    </style>
  </head>

  <body>
    <h3>Dev Toolbox</h3>

    <select id="toolSelect">
      <option value="">-- Select a tool --</option>
      <option value="color">Color Picker</option>
      <option value="json">JSON Formatter</option>
    </select>

    <div id="toolContainer"></div>

    <script type="module" src="popup.js"></script>

    <script>
      function resizePopup() {
        document.body.style.height = document.body.scrollHeight + "px"
      }
      new MutationObserver(resizePopup).observe(document.body, { childList: true, subtree: true })
      resizePopup()
    </script>
  </body>
</html>
