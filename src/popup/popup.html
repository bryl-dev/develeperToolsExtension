<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Dev Toolbox</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 360px;
        min-height: 320px;
        max-height: 560px;
        overflow-y: auto;
        background: #f5f5f5;
        font-family: system-ui, sans-serif;
      }

      h3 {
        margin: 12px 12px 8px;
        font-size: 1.1rem;
        text-align: center;
        color: #222;
      }

      #toolSelect {
        display: block;
        margin: 0 auto 8px auto;
        padding: 6px 8px;
        width: 90%;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 0.95rem;
        background: white;
      }

      .popup-actions {
        text-align: center;
        margin-bottom: 10px;
      }

      #openPage {
        font-size: 0.8rem;
        color: #2f6feb;
        text-decoration: none;
      }

      #openPage:hover {
        text-decoration: underline;
      }

      #toolContainer {
        display: block;
        padding: 0 10px 12px 10px;
      }
    </style>
  </head>

  <body>
    <h3>Dev Toolbox</h3>

    <select id="toolSelect"></select>

    <div class="popup-actions">
      <a id="openPage" href="#">Open full page &rarr;</a>
    </div>

    <div id="toolContainer"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
